plugins { id 'com.android.application' }
android {
    namespace 'com.darkfall.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.darkfall.game'
        minSdk 26
        targetSdk 35
        versionCode 1536
        versionName '0.1536'
    }
    signingConfigs {
        if (System.getenv('DARKFALL_KEYSTORE_PATH')) {
            persistent {
                storeFile file(System.getenv('DARKFALL_KEYSTORE_PATH'))
                storePassword System.getenv('DARKFALL_STORE_PASSWORD')
                keyAlias System.getenv('DARKFALL_KEY_ALIAS')
                keyPassword System.getenv('DARKFALL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('DARKFALL_KEYSTORE_PATH')) signingConfig signingConfigs.persistent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.core:core:1.13.1' }

// Reassemble the original HTML for every Android build, including Android Studio.
def gameBundle = rootProject.file('game-bundle')
def gameHtml = file('src/main/assets/index.html')
def pythonCommand = providers.environmentVariable('DARKFALL_PYTHON').orElse(
    System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
)
tasks.register('materializeBundledGame', Exec) {
    workingDir rootProject.projectDir
    inputs.files(fileTree(gameBundle), rootProject.file('scripts/materialize_game.py'))
    outputs.file(gameHtml)
    commandLine pythonCommand.get(), rootProject.file('scripts/materialize_game.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn tasks.named('materializeBundledGame') }
