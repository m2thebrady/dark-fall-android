name: Dark Fall browser smoke test (experimental)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/browser_smoke.mjs'
      - 'game-bundle/**'
      - 'scripts/materialize_game.py'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          # Hosted Ubuntu already includes browser libraries. Install OS packages
          # only when the actual browser launch proves they are required.
          node --input-type=module -e "import {chromium} from 'playwright'; const b=await chromium.launch({headless:true});await b.close();" || npx playwright install-deps chromium
      - name: Materialize verified bundled game
        run: python3 scripts/materialize_game.py
      - name: Run browser startup test
        run: node scripts/browser_smoke.mjs
      - name: Verify screenshot artifacts
        run: python3 scripts/check_screenshots.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-fall-browser-smoke
          path: browser-smoke-results/
          if-no-files-found: ignore
          retention-days: 14
