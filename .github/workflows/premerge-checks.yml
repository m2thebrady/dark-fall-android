name: Dark Fall pre-merge checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply bundled-game display patches
        run: python3 scripts/patch_fighter_label.py
      - name: Validate Android configuration
        run: python3 scripts/validate_project.py
      - name: Check HTML and JavaScript
        run: python3 scripts/preflight_game.py
      - name: Audit sprite and rendering sources
        run: python3 scripts/audit_sprites.py
      - name: Install asset-tool dependencies
        run: python3 -m pip install Pillow
      - name: Self-test sprite validation and previews
        run: python3 scripts/test_asset_pipeline.py
      - name: Self-test asset revision selection
        run: python3 scripts/test_asset_selection.py
      - name: Self-test animation silhouette diagnostics
        run: python3 scripts/test_animation_inspection.py
      - name: Self-test animated sprite previews
        run: python3 scripts/test_animation_preview.py
      - name: Self-test animation state selection
        run: python3 scripts/test_animation_state.py
      - name: Validate handcrafted map data
        run: |
          python3 scripts/validate_map.py maps/woodland-approach.json
          python3 scripts/test_map_validation.py
      - name: Validate modular body profiles
        run: |
          python3 scripts/validate_body_profile.py assets/profiles/warden.json assets/profiles/wolf.json assets/profiles/raven.json
          python3 scripts/test_body_profiles.py
          python3 scripts/test_palette_diagnostics.py
          python3 scripts/test_animation_coverage.py
          python3 scripts/test_character_build.py
          python3 scripts/test_animation_transitions.py
          python3 scripts/test_transition_preview.py
      - name: Survey legacy renderer and sprite references
        run: python3 scripts/survey_renderer.py
      - name: Upload renderer survey report
        uses: actions/upload-artifact@v4
        with:
          name: dark-fall-renderer-survey
          path: browser-smoke-results/renderer-survey.json
          if-no-files-found: error
          retention-days: 14
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
