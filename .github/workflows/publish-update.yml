name: Publish signed Dark Fall update
on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - 'game-bundle/**'
      - 'scripts/materialize_game.py'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Materialize verified bundled game
        run: python3 scripts/materialize_game.py
      - name: Check bundled HTML and JavaScript
        run: python3 scripts/preflight_game.py
      - name: Validate
        run: python3 scripts/validate_project.py
      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DARKFALL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARKFALL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARKFALL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARKFALL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing signing secrets'; exit 1; }
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DARKFALL_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkfall-release.jks"
      - name: Build signed release APK
        env:
          DARKFALL_KEYSTORE_PATH: ${{ runner.temp }}/darkfall-release.jks
          DARKFALL_STORE_PASSWORD: ${{ secrets.DARKFALL_STORE_PASSWORD }}
          DARKFALL_KEY_ALIAS: ${{ secrets.DARKFALL_KEY_ALIAS }}
          DARKFALL_KEY_PASSWORD: ${{ secrets.DARKFALL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk | tail -n 1
          cp app/build/outputs/apk/release/app-release.apk dark-fall.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a published version."
            exit 1
          fi
          zip -q -6 -j dark-fall-game.zip app/src/main/assets/index.html
          gh release create "$TAG" dark-fall.apk dark-fall-game.zip --title "Dark Fall $TAG" --notes "Signed Android release $TAG" --latest --target "$GITHUB_SHA"
